name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Typecheck, build, and schema smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Apply D1 migrations to clean local database
        run: npm run db:migrate:local

      - name: Verify immutable-history acceptance
        run: |
          set -e

          npx wrangler d1 execute store-db --local --command "
            INSERT INTO organizations (id, name, currency)
            VALUES ('accept_org', 'Acceptance School', 'NGN');

            INSERT INTO \"user\" (id, name, email, emailVerified, createdAt, updatedAt)
            VALUES ('accept_user', 'Acceptance Owner', 'accept@example.com', 1, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);

            INSERT INTO organization_members (organization_id, user_id, role, status)
            VALUES ('accept_org', 'accept_user', 'OWNER', 'ACTIVE');

            INSERT INTO products (id, organization_id, name)
            VALUES ('accept_product', 'accept_org', 'Test Item');

            INSERT INTO product_variants (
              id, organization_id, product_id, variant_name, selling_price_minor
            )
            VALUES (
              'accept_variant', 'accept_org', 'accept_product', 'Default', 1000
            );

            INSERT INTO sales (
              id, organization_id, total_minor, created_by_user_id
            )
            VALUES ('accept_sale', 'accept_org', 1000, 'accept_user');

            INSERT INTO sale_items (
              id, organization_id, sale_id, product_variant_id,
              quantity, unit_price_minor, line_total_minor
            )
            VALUES (
              'accept_sale_item', 'accept_org', 'accept_sale', 'accept_variant',
              1, 1000, 1000
            );

            INSERT INTO payments (
              id, organization_id, sale_id, amount_minor, received_by_user_id
            )
            VALUES (
              'accept_payment', 'accept_org', 'accept_sale', 1000, 'accept_user'
            );

            INSERT INTO stock_movements (
              id, organization_id, product_variant_id, movement_type,
              quantity_delta, related_sale_id, created_by_user_id
            )
            VALUES (
              'accept_movement', 'accept_org', 'accept_variant', 'SALE',
              -1, 'accept_sale', 'accept_user'
            );

            INSERT INTO audit_events (
              id, organization_id, actor_user_id, event_type,
              entity_type, entity_id, metadata_json
            )
            VALUES (
              'accept_audit', 'accept_org', 'accept_user',
              'SALE_CREATED', 'sale', 'accept_sale', '{}'
            );
          "

          expect_blocked() {
            label="$1"
            sql="$2"

            set +e
            output=$(npx wrangler d1 execute store-db --local --command "$sql" 2>&1)
            status=$?
            set -e

            echo "=== $label ==="
            echo "$output"

            if [ "$status" -eq 0 ]; then
              echo "FAIL: $label was allowed."
              exit 1
            fi
          }

          expect_blocked "audit update" "UPDATE audit_events SET event_type='TAMPERED' WHERE id='accept_audit';"
          expect_blocked "audit delete" "DELETE FROM audit_events WHERE id='accept_audit';"
          expect_blocked "sale delete" "DELETE FROM sales WHERE id='accept_sale';"
          expect_blocked "sale item delete" "DELETE FROM sale_items WHERE id='accept_sale_item';"
          expect_blocked "payment delete" "DELETE FROM payments WHERE id='accept_payment';"
          expect_blocked "stock movement delete" "DELETE FROM stock_movements WHERE id='accept_movement';"
          expect_blocked "audit without actor" "INSERT INTO audit_events (id, organization_id, actor_user_id, event_type, entity_type, entity_id) VALUES ('accept_no_actor', 'accept_org', NULL, 'TEST', 'test', 'accept_test');"

          npx wrangler d1 execute store-db --local --json --command "
            SELECT
              (SELECT COUNT(*) FROM audit_events WHERE id='accept_audit') AS audit_preserved,
              (SELECT COUNT(*) FROM sales WHERE id='accept_sale') AS sale_preserved,
              (SELECT COUNT(*) FROM sale_items WHERE id='accept_sale_item') AS sale_item_preserved,
              (SELECT COUNT(*) FROM payments WHERE id='accept_payment') AS payment_preserved,
              (SELECT COUNT(*) FROM stock_movements WHERE id='accept_movement') AS movement_preserved;
          " > /tmp/immutable-acceptance.json

          cat /tmp/immutable-acceptance.json

          for field in audit_preserved sale_preserved sale_item_preserved payment_preserved movement_preserved
          do
            if ! grep -Eq "\"$field\"[[:space:]]*:[[:space:]]*1" /tmp/immutable-acceptance.json; then
              echo "FAIL: immutable record was not preserved: $field"
              exit 1
            fi
          done


  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply remote D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Auth database integrity diagnostics
        run: |
          npx wrangler d1 execute store-db --remote --json --command '
            SELECT
              (SELECT COUNT(*) FROM "user") AS users,
              (SELECT COUNT(*) FROM account WHERE providerId = "credential" AND password IS NOT NULL) AS credential_accounts,
              (SELECT COUNT(*) FROM session) AS sessions,
              (SELECT COUNT(*) FROM organization_members WHERE status = "ACTIVE") AS active_memberships,
              (
                SELECT COUNT(*)
                FROM "user" u
                LEFT JOIN account a
                  ON a.userId = u.id
                 AND a.providerId = "credential"
                WHERE a.id IS NULL
              ) AS users_without_credential;
          '

      - name: Production smoke and runtime diagnostics
        run: |
          set +e
          timeout 20s npx wrangler tail store --format=json > /tmp/store-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 4

          curl -sS -D /tmp/store-headers.txt https://store.article6.org/login -o /tmp/store-body.html
          CURL_STATUS=$?

          sleep 5
          kill $TAIL_PID 2>/dev/null || true

          echo "=== RESPONSE HEADERS ==="
          cat /tmp/store-headers.txt || true
          echo "=== WORKER TAIL ==="
          cat /tmp/store-tail.log || true

          if [ "$CURL_STATUS" -ne 0 ]; then
            exit "$CURL_STATUS"
          fi

          if ! grep -Eq "^HTTP/[0-9.]+ 2[0-9][0-9]" /tmp/store-headers.txt; then
            echo "Production login page smoke test failed."
            exit 1
          fi

          if ! grep -q 'action="/api/login"' /tmp/store-body.html; then
            echo "Production login form is missing the server fallback."
            exit 1
          fi

          if ! grep -q 'name="email"' /tmp/store-body.html || ! grep -q 'name="password"' /tmp/store-body.html; then
            echo "Production login inputs are missing form field names."
            exit 1
          fi

          curl -sS -D /tmp/store-http-headers.txt \
            -o /dev/null \
            http://store.article6.org/login

          echo "=== HTTP LOGIN RESPONSE HEADERS ==="
          cat /tmp/store-http-headers.txt || true

          if ! grep -Eq "^HTTP/[0-9.]+ (301|302|307|308)" /tmp/store-http-headers.txt; then
            echo "HTTP login page did not redirect to HTTPS."
            exit 1
          fi

          if ! grep -Eiq "^location: https://store\.article6\.org/login" /tmp/store-http-headers.txt; then
            echo "HTTP login redirect did not target HTTPS."
            exit 1
          fi

          curl -sS -D /tmp/store-login-json-headers.txt \
            -o /tmp/store-login-json-body.txt \
            -X POST \
            -H "Accept: application/json" \
            -H "X-School-Ledger-Client: fetch" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "email=definitely-not-a-user%40example.invalid&password=definitely-wrong" \
            https://store.article6.org/api/login

          echo "=== INVALID LOGIN JSON RESPONSE ==="
          cat /tmp/store-login-json-headers.txt || true
          cat /tmp/store-login-json-body.txt || true

          if ! grep -Eq "^HTTP/[0-9.]+ 401" /tmp/store-login-json-headers.txt; then
            echo "Production invalid-login JSON path did not return 401."
            exit 1
          fi

          curl -sS -D /tmp/store-login-post-headers.txt \
            -o /tmp/store-login-post-body.html \
            -X POST \
            -H "Accept: text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "email=definitely-not-a-user%40example.invalid&password=definitely-wrong" \
            https://store.article6.org/api/login

          echo "=== INVALID LOGIN RESPONSE HEADERS ==="
          cat /tmp/store-login-post-headers.txt || true

          if ! grep -Eq "^HTTP/[0-9.]+ 303" /tmp/store-login-post-headers.txt; then
            echo "Production invalid-login smoke test did not return 303."
            exit 1
          fi

          if ! grep -Eiq "^location: https://store\.article6\.org/login\?error=credentials" /tmp/store-login-post-headers.txt; then
            echo "Production invalid-login smoke test did not return the expected credentials error."
            exit 1
          fi

          if ! grep -Eiq "^content-type: text/html; charset=utf-8" /tmp/store-login-post-headers.txt; then
            echo "Browser login response was not HTML."
            exit 1
          fi

          if ! grep -Eiq "^content-disposition: inline" /tmp/store-login-post-headers.txt; then
            echo "Browser login response was not explicitly inline."
            exit 1
          fi
