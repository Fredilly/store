name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Typecheck, build, and schema smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Apply D1 migrations to clean local database
        run: npm run db:migrate:local

      - name: Core acceptance regression suite
        run: npm run test:acceptance

      - name: Export and recovery acceptance
        run: bash scripts/export-regression.sh

      - name: Verify immutable-history database guards
        run: |
          npx wrangler d1 execute store-db --local --json --command "
            SELECT name
            FROM sqlite_master
            WHERE type = 'trigger'
              AND name IN (
                'prevent_audit_events_update',
                'prevent_audit_events_delete',
                'prevent_sales_delete',
                'prevent_sale_items_delete',
                'prevent_payments_delete',
                'prevent_stock_movements_delete',
                'require_audit_actor'
              )
            ORDER BY name;
          " > /tmp/audit-triggers.json

          cat /tmp/audit-triggers.json

          for trigger in             prevent_audit_events_update             prevent_audit_events_delete             prevent_sales_delete             prevent_sale_items_delete             prevent_payments_delete             prevent_stock_movements_delete             require_audit_actor
          do
            if ! grep -q "$trigger" /tmp/audit-triggers.json; then
              echo "Missing immutable-history trigger: $trigger"
              exit 1
            fi
          done


  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply remote D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Auth database integrity diagnostics
        run: |
          npx wrangler d1 execute store-db --remote --json --command '
            SELECT
              (SELECT COUNT(*) FROM "user") AS users,
              (SELECT COUNT(*) FROM account WHERE providerId = "credential" AND password IS NOT NULL) AS credential_accounts,
              (SELECT COUNT(*) FROM session) AS sessions,
              (SELECT COUNT(*) FROM organization_members WHERE status = "ACTIVE") AS active_memberships,
              (
                SELECT COUNT(*)
                FROM "user" u
                LEFT JOIN account a
                  ON a.userId = u.id
                 AND a.providerId = "credential"
                WHERE a.id IS NULL
              ) AS users_without_credential;
          '

      - name: Production signup and login round-trip
        run: |
          set -euo pipefail

          QA_EMAIL="qa-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          QA_PASSWORD="QaRoundTrip-9x7m!"

          cleanup() {
            npx wrangler d1 execute store-db --remote --command "
              DELETE FROM session
              WHERE userId IN (SELECT id FROM \"user\" WHERE email = '${QA_EMAIL}');
              DELETE FROM account
              WHERE userId IN (SELECT id FROM \"user\" WHERE email = '${QA_EMAIL}');
              DELETE FROM organization_members
              WHERE user_id IN (SELECT id FROM \"user\" WHERE email = '${QA_EMAIL}');
              DELETE FROM \"user\" WHERE email = '${QA_EMAIL}';
            " >/dev/null 2>&1 || true
          }

          trap cleanup EXIT
          cleanup

          curl -sS -D /tmp/qa-signup-headers.txt \
            -o /tmp/qa-signup-body.txt \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "name=QA Auth Round Trip" \
            --data-urlencode "email=${QA_EMAIL}" \
            --data-urlencode "password=${QA_PASSWORD}" \
            --data-urlencode "confirm_password=${QA_PASSWORD}" \
            https://store.article6.org/api/signup

          if ! grep -Eq "^HTTP/[0-9.]+ 303" /tmp/qa-signup-headers.txt; then
            echo "Production signup did not return 303."
            cat /tmp/qa-signup-headers.txt
            cat /tmp/qa-signup-body.txt
            exit 1
          fi

          npx wrangler d1 execute store-db --remote --json --command "
            SELECT COUNT(*) AS credential_accounts
            FROM account a
            JOIN \"user\" u ON u.id = a.userId
            WHERE u.email = '${QA_EMAIL}'
              AND a.providerId = 'credential'
              AND a.password IS NOT NULL;
          " > /tmp/qa-credential.json

          cat /tmp/qa-credential.json

          if ! grep -Eq '"credential_accounts"[[:space:]]*:[[:space:]]*1' /tmp/qa-credential.json; then
            echo "Signup did not create a credential/password account."
            exit 1
          fi

          curl -sS -D /tmp/qa-login-headers.txt \
            -o /tmp/qa-login-body.json \
            -X POST \
            -H "Accept: application/json" \
            -H "X-School-Ledger-Client: fetch" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "email=${QA_EMAIL}" \
            --data-urlencode "password=${QA_PASSWORD}" \
            https://store.article6.org/api/login

          cat /tmp/qa-login-headers.txt
          cat /tmp/qa-login-body.json

          if ! grep -Eq "^HTTP/[0-9.]+ 200" /tmp/qa-login-headers.txt; then
            echo "Fresh signup could not sign back in with the same password."
            exit 1
          fi

          if ! grep -q '"ok":true' /tmp/qa-login-body.json; then
            echo "Fresh signup login response did not report ok=true."
            exit 1
          fi

          echo "PASS: production signup -> credential -> login round-trip"

      - name: Production smoke and runtime diagnostics
        run: |
          set +e
          timeout 20s npx wrangler tail store --format=json > /tmp/store-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 4

          curl -sS -D /tmp/store-headers.txt https://store.article6.org/login -o /tmp/store-body.html
          CURL_STATUS=$?

          curl -sS -D /tmp/store-health-headers.txt https://store.article6.org/api/health -o /tmp/store-health.json
          HEALTH_STATUS=$?

          sleep 5
          kill $TAIL_PID 2>/dev/null || true

          echo "=== RESPONSE HEADERS ==="
          cat /tmp/store-headers.txt || true
          echo "=== WORKER TAIL ==="
          cat /tmp/store-tail.log || true

          if [ "$CURL_STATUS" -ne 0 ]; then
            exit "$CURL_STATUS"
          fi

          if [ "$HEALTH_STATUS" -ne 0 ]; then
            exit "$HEALTH_STATUS"
          fi

          if ! grep -Eq "^HTTP/[0-9.]+ 200" /tmp/store-health-headers.txt; then
            echo "Production health check did not return 200."
            cat /tmp/store-health-headers.txt || true
            cat /tmp/store-health.json || true
            exit 1
          fi

          if ! grep -q '"ok":true' /tmp/store-health.json; then
            echo "Production health check did not report ok=true."
            cat /tmp/store-health.json || true
            exit 1
          fi

          if ! grep -Eq "^HTTP/[0-9.]+ 2[0-9][0-9]" /tmp/store-headers.txt; then
            echo "Production login page smoke test failed."
            exit 1
          fi

          if ! grep -q 'action="/api/login"' /tmp/store-body.html; then
            echo "Production login form is missing the server fallback."
            exit 1
          fi

          if ! grep -q 'name="email"' /tmp/store-body.html || ! grep -q 'name="password"' /tmp/store-body.html; then
            echo "Production login inputs are missing form field names."
            exit 1
          fi

          curl -sS -D /tmp/store-http-headers.txt \
            -o /dev/null \
            http://store.article6.org/login

          echo "=== HTTP LOGIN RESPONSE HEADERS ==="
          cat /tmp/store-http-headers.txt || true

          if ! grep -Eq "^HTTP/[0-9.]+ (301|302|307|308)" /tmp/store-http-headers.txt; then
            echo "HTTP login page did not redirect to HTTPS."
            exit 1
          fi

          if ! grep -Eiq "^location: https://store\.article6\.org/login" /tmp/store-http-headers.txt; then
            echo "HTTP login redirect did not target HTTPS."
            exit 1
          fi

          curl -sS -D /tmp/store-login-json-headers.txt \
            -o /tmp/store-login-json-body.txt \
            -X POST \
            -H "Accept: application/json" \
            -H "X-School-Ledger-Client: fetch" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "email=definitely-not-a-user%40example.invalid&password=definitely-wrong" \
            https://store.article6.org/api/login

          echo "=== INVALID LOGIN JSON RESPONSE ==="
          cat /tmp/store-login-json-headers.txt || true
          cat /tmp/store-login-json-body.txt || true

          if ! grep -Eq "^HTTP/[0-9.]+ 401" /tmp/store-login-json-headers.txt; then
            echo "Production invalid-login JSON path did not return 401."
            exit 1
          fi

          curl -sS -D /tmp/store-login-post-headers.txt \
            -o /tmp/store-login-post-body.html \
            -X POST \
            -H "Accept: text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "email=definitely-not-a-user%40example.invalid&password=definitely-wrong" \
            https://store.article6.org/api/login

          echo "=== INVALID LOGIN RESPONSE HEADERS ==="
          cat /tmp/store-login-post-headers.txt || true

          if ! grep -Eq "^HTTP/[0-9.]+ 303" /tmp/store-login-post-headers.txt; then
            echo "Production invalid-login smoke test did not return 303."
            exit 1
          fi

          if ! grep -Eiq "^location: https://store\.article6\.org/login\?error=credentials" /tmp/store-login-post-headers.txt; then
            echo "Production invalid-login smoke test did not return the expected credentials error."
            exit 1
          fi

          if ! grep -Eiq "^content-type: text/html; charset=utf-8" /tmp/store-login-post-headers.txt; then
            echo "Browser login response was not HTML."
            exit 1
          fi

          if ! grep -Eiq "^content-disposition: inline" /tmp/store-login-post-headers.txt; then
            echo "Browser login response was not explicitly inline."
            exit 1
          fi
